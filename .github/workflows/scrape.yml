name: Scrape leaderboard

on:
  schedule:
    # Krillion's day resets at midnight America/New_York. We want 10pm ET (backup)
    # and 11pm ET (main). Cron is UTC with no DST, so fire at 02:05, 03:05 and
    # 04:05 UTC and let the guard below skip any run that isn't 10pm/11pm in New York.
    - cron: "5 2,3,4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only run at 10pm/11pm New York time (scheduled runs)
        id: guard
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "New York hour: $hour"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "22" ] && [ "$hour" != "23" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch friends leaderboard
        if: steps.guard.outputs.run == 'true'
        env:
          KRILLION_REFRESH_TOKEN: ${{ secrets.KRILLION_REFRESH_TOKEN }}
        run: node scripts/scrape.mjs
      - name: Commit changes
        if: steps.guard.outputs.run == 'true'
        run: |
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "krillion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
